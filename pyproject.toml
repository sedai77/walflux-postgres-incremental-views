[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "walflux"
dynamic = ["version"]
description = "Millisecond-fresh materialized views for Postgres, maintained incrementally from logical replication. No extensions, no triggers, no second database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "WalFlux contributors" }]
keywords = [
  "postgres",
  "postgresql",
  "materialized-view",
  "incremental-view-maintenance",
  "ivm",
  "cdc",
  "change-data-capture",
  "logical-replication",
  "pgoutput",
  "streaming",
  "real-time-aggregation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "psycopg2-binary>=2.9",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/sedai77/walflux-postgres-incremental-views"
Repository = "https://github.com/sedai77/walflux-postgres-incremental-views"
Documentation = "https://github.com/sedai77/walflux-postgres-incremental-views#readme"
Changelog = "https://github.com/sedai77/walflux-postgres-incremental-views/blob/main/CHANGELOG.md"
Issues = "https://github.com/sedai77/walflux-postgres-incremental-views/issues"

[project.scripts]
walflux = "walflux.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# The single source of the version: bump __version__ in walflux/__init__.py.
[tool.hatch.version]
path = "walflux/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["walflux"]

[tool.pytest.ini_options]
markers = [
  "integration: requires a running Postgres 15+ with wal_level=logical (set WALFLUX_TEST_DSN)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
